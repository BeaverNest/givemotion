# givemotion in Docker on M80Q.
#
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml run --rm givemotion doctor
#   givemotion render demo/index.html -o demo/out/video.mp4      (wrapper in ~/.local/bin)
#
# The engine is the host checkout (bind mount), so editing src/ on the host changes the very
# next render. Only the machine (node, Chrome, ffmpeg, fonts) comes from the image.
services:
  givemotion:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: givemotion:local
    working_dir: /work
    volumes:
      - ../:/work              # the fork, live
      - gm-cache:/cache        # frame/part cache and cross-render leases
      - ${GM_PROJECTS:-/home/beavernest/givemotion-projects}:/videos  # scratch projects, outside the repo
    environment:
      GIVEMOTION_CACHE: /cache
      GIVEMOTION_NO_SANDBOX: "1"
      # Keep the box answerable: two browsers on four cores, at a low priority. Measured on the
      # starter page: 2 browsers = 9.8 s, 3 = 15.1 s (browsers fight over the same cores), 6 = 6.1 s.
      # Idle machine? `GM_WORKERS=6 GM_NICE=0 docker compose ... run --rm givemotion render ...`
      GM_WORKERS: "${GM_WORKERS:-2}"
      GM_NICE: "${GM_NICE:-10}"
    # Chrome's frame capture needs shared memory; the 64 MB default is where renders die
    # halfway with no useful message.
    shm_size: 1gb
    init: true
    # A render is CPU-bound: four cores of sixteen by default, and a memory ceiling so a runaway
    # page is killed instead of pushing the host into swap.
    cpus: "4"
    mem_limit: 4g

volumes:
  # A fixed name: the compose project name comes from the directory, and binding renders to the
  # cache/lease directory must not change because someone copies the repo somewhere else.
  gm-cache:
    name: givemotion-cache
